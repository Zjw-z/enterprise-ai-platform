name: enterprise-ai-platform-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      EAP_SYSTEM_DATABASE_URL: postgresql+asyncpg://ai_user:123456@localhost:5432/enterprise_ai
      EAP_SYSTEM_JWT_SECRET: ci-system-secret-with-at-least-32-characters
      EAP_SYSTEM_ADMIN_PASSWORD: ci-admin-password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise_ai
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: "123456"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_user -d enterprise_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Prepare sanitized test configuration
        run: cp config.production.yaml config.test.yaml
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report
      - run: ruff check app tests

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
